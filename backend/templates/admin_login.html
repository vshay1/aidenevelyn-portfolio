<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    
    <link rel="stylesheet" href="/css/admin_login.css">
    <link rel="icon" type="image/svg+xml" href="/frontend/favicon.svg">
</head>
<body>
    <div class="login-container">
        <div class="login-title">ADMIN</div>
        <div class="login-subtitle">SECURE ACCESS ONLY</div>
        
        <div class="divider"></div>
        
        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            
            <button type="submit" class="login-button">ACCESS PANEL</button>
        </form>
        
        <div class="error-message" id="errorMessage">Invalid credentials. Please try again.</div>
        
        <div class="divider"></div>
        
        <a href="/index.html" class="back-link">← Return to site</a>
    </div>
    
    <script src="/js/admin_login.js"></script>
</body>
</html>
